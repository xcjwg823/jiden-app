<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mochi Motion Reel</title>
<style>
@font-face{font-family:'Dela Gothic One';src:url(fonts/DelaGothic.ttf)}
@font-face{font-family:'Zen Maru Gothic';font-weight:700;src:url(fonts/ZenMaru-700.ttf)}
@font-face{font-family:'Zen Maru Gothic';font-weight:900;src:url(fonts/ZenMaru-900.ttf)}
@font-face{font-family:'Fraunces';font-style:italic;font-weight:900;src:url(fonts/Fraunces-BI.ttf)}
html,body{margin:0;height:100%;background:#15100d;display:grid;place-items:center;overflow:hidden}
canvas{height:100vh;max-width:100vw;aspect-ratio:9/16;display:block}
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
/* =========================================================
   MOCHI — 15s motion reel. Deterministic: render(t) draws
   the frame at time t (seconds). Renderer samples several
   sub-frames per frame for true shutter motion blur.
   ========================================================= */
const W = 1080, H = 1920, DUR = 15, PI = Math.PI, TAU = PI * 2;
const OUT = document.getElementById('c');
const SCR = document.createElement('canvas'); SCR.width = W; SCR.height = H;
let ctx = SCR.getContext('2d');

const COL = {
  cream: '#F3EEE7', mocha: '#3A302A', dark: '#24201D', pink: '#D9C7BA', pinkD: '#B89484',
  sage: '#8F9A7E', yolk: '#D6A45E', tomato: '#B5553F', ig: '#3A302A', white: '#FBF8F3', greige: '#E6DDD2'
};
const JP = "'Zen Maru Gothic'", DELA = JP, SERIF = "'Fraunces'";

/* ---------- math ---------- */
const cl = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const P = (t, a, b) => cl((t - a) / (b - a));
const lerp = (a, b, k) => a + (b - a) * k;
const mod = (a, n) => ((a % n) + n) % n;
const hs = i => { const x = Math.sin(i * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
const E = {
  inC: k => k * k * k,
  outC: k => 1 - Math.pow(1 - k, 3),
  ioC: k => k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2,
  outQ: k => 1 - Math.pow(1 - k, 5),
  outBack: (k, s = 1.70158) => k <= 0 ? 0 : 1 + (s + 1) * Math.pow(k - 1, 3) + s * Math.pow(k - 1, 2),
  outExpo: k => k >= 1 ? 1 : 1 - Math.pow(2, -10 * k),
  inExpo: k => k <= 0 ? 0 : Math.pow(2, 10 * k - 10),
  ioExpo: k => k <= 0 ? 0 : k >= 1 ? 1 : k < .5 ? Math.pow(2, 20 * k - 10) / 2 : (2 - Math.pow(2, -20 * k + 10)) / 2,
};
// decaying oscillation that starts at `amp` (for squash / punch)
const osc = (t, f, d) => t < 0 ? 0 : Math.exp(-d * t) * Math.cos(TAU * f * t);

/* ---------- primitives ---------- */
function bg(c) { ctx.fillStyle = c; ctx.fillRect(-50, -50, W + 100, H + 100); }
function circ(x, y, r) { ctx.beginPath(); ctx.arc(x, y, Math.max(0, r), 0, TAU); }
function ell(x, y, rx, ry, rot = 0) { ctx.beginPath(); ctx.ellipse(x, y, Math.max(0, rx), Math.max(0, ry), rot, 0, TAU); }
function rr(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }
function star4(x, y, r, rot) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot); ctx.beginPath();
  for (let i = 0; i < 4; i++) {
    const a = i * PI / 2, b = a + PI / 4;
    ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r);
    ctx.lineTo(Math.cos(b) * r * .26, Math.sin(b) * r * .26);
  }
  ctx.closePath(); ctx.fill(); ctx.restore();
}
function heart(x, y, s, rot = 0) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot); ctx.scale(s / 100, s / 100); ctx.beginPath();
  ctx.moveTo(0, 32); ctx.bezierCurveTo(-58, -4, -38, -58, 0, -26); ctx.bezierCurveTo(38, -58, 58, -4, 0, 32);
  ctx.fill(); ctx.restore();
}

function bokeh(u, n, col, seed, alpha = 1) {
  for (let i = 0; i < n; i++) {
    const x = hs(seed + i) * W + Math.sin(u * .7 + i) * 50, y = mod(hs(seed + i * 3) * H - u * 40 * (1 + hs(i + 1)), H + 400) - 200;
    const r = 70 + hs(seed + i * 7) * 170, a = (.18 + .22 * hs(seed + i * 5)) * alpha * (.75 + .25 * Math.sin(u * 3 + i));
    const g = ctx.createRadialGradient(x, y, 0, x, y, r);
    g.addColorStop(0, `rgba(${col},${a})`); g.addColorStop(.55, `rgba(${col},${a * .6})`); g.addColorStop(1, `rgba(${col},0)`);
    ctx.fillStyle = g; circ(x, y, r); ctx.fill();
  }
}
// warm film light-leak that sweeps across the frame on every cut
function leak(k, seed) {
  if (k <= 0 || k >= 1) return;
  const a = .65 * Math.sin(k * PI) ** 1.5, dir = seed % 2 ? 1 : -1;
  ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalCompositeOperation = 'lighter';
  const x = 540 + dir * lerp(-900, 900, E.ioC(k)), y = 500 + hs(seed) * 900;
  let g = ctx.createRadialGradient(x, y, 0, x, y, 1100);
  g.addColorStop(0, `rgba(255,226,185,${.75 * a})`); g.addColorStop(.35, `rgba(235,170,110,${.4 * a})`); g.addColorStop(1, 'rgba(200,120,70,0)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  const x2 = 540 - dir * lerp(-700, 700, k), y2 = H - y;
  g = ctx.createRadialGradient(x2, y2, 0, x2, y2, 600);
  g.addColorStop(0, `rgba(255,240,220,${.45 * a})`); g.addColorStop(1, 'rgba(255,240,220,0)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  // thin anamorphic streak
  ctx.fillStyle = `rgba(255,236,210,${.5 * a})`; ctx.fillRect(0, y - 3, W, 6);
  ctx.restore();
}

/* ---------- type ---------- */
function txt(s, x, y, size, { font = DELA, weight = '900', italic = '', color = '#fff', align = 'center', stroke = null, sw = 0, alpha = 1, ls = 0 } = {}) {
  ctx.save(); ctx.globalAlpha *= alpha;
  ctx.font = `${italic} ${weight} ${size}px ${font}`; ctx.textAlign = align; ctx.textBaseline = 'middle';
  ctx.letterSpacing = ls + 'px';
  if (stroke) { ctx.lineJoin = 'round'; ctx.lineWidth = sw; ctx.strokeStyle = stroke; ctx.strokeText(s, x, y); }
  ctx.fillStyle = color; ctx.fillText(s, x, y); ctx.restore();
}
// per-character kinetic type
function kin(str, x, y, t, o = {}) {
  if (t <= 0) return;
  const { size = 100, font = DELA, weight = '900', italic = '', color = '#fff', stroke = null, sw = 0,
    st = .035, dur = .3, mode = 'pop', ls = 0, maxW = 0, shadow = null, alpha = 1 } = o;
  ctx.save(); ctx.globalAlpha *= alpha;
  ctx.font = `${italic} ${weight} ${size}px ${font}`;
  const ch = [...str], ws = ch.map(c => ctx.measureText(c).width);
  const tot = ws.reduce((a, b) => a + b, 0) + ls * (ch.length - 1);
  const sc = maxW && tot > maxW ? maxW / tot : 1;
  ctx.translate(x, y); ctx.scale(sc, sc);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.lineJoin = 'round';
  let cx = -tot / 2;
  ch.forEach((c, i) => {
    const k = P(t, i * st, i * st + dur);
    if (k > 0) {
      ctx.save(); ctx.translate(cx + ws[i] / 2, 0);
      if (mode === 'pop') {
        const s = E.outBack(k, 2.6);
        ctx.translate(0, (1 - E.outC(k)) * size * .55);
        ctx.rotate((1 - E.outC(k)) * (hs(i * 7 + ch.length) - .5) * 1.4);
        ctx.scale(s, s);
      } else if (mode === 'drop') {
        ctx.translate(0, -(1 - E.outBack(k, 2.2)) * size * 1.6);
        ctx.rotate((1 - E.outC(k)) * (hs(i + 3) - .5) * .8);
        ctx.globalAlpha *= cl(k * 5);
      } else if (mode === 'slide') {
        ctx.translate(0, (1 - E.outQ(k)) * size * .9);
        ctx.globalAlpha *= cl(k * 3);
      }
      if (shadow) { ctx.fillStyle = shadow; ctx.fillText(c, 7, 10); }
      if (stroke) { ctx.lineWidth = sw; ctx.strokeStyle = stroke; ctx.strokeText(c, 0, 0); }
      ctx.fillStyle = color; ctx.fillText(c, 0, 0);
      ctx.restore();
    }
    cx += ws[i] + ls;
  });
  ctx.restore();
}
function pill(x, y, str, k, { size = 50, bg: b = '#fff', fg = COL.mocha, padX = 44, h = 0, weight = 900 } = {}) {
  if (k <= 0) return;
  ctx.save(); ctx.font = `${weight} ${size}px ${JP}`;
  const w = ctx.measureText(str).width + padX * 2, hh = h || size * 1.85;
  ctx.translate(x, y); const s = E.outBack(k, 2.2); ctx.scale(s, s);
  ctx.fillStyle = b; rr(-w / 2, -hh / 2, w, hh, hh / 2); ctx.fill();
  ctx.fillStyle = fg; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(str, 0, size * .04);
  ctx.restore();
}
function marquee(str, y, size, speed, t, { fill = null, stroke = null, sw = 3, alpha = 1, rot = 0, font = null } = {}) {
  if (alpha <= 0) return;
  ctx.save(); ctx.globalAlpha *= alpha; ctx.translate(W / 2, y); ctx.rotate(rot);
  ctx.font = font || `italic 900 ${size}px ${SERIF}`; ctx.textBaseline = 'middle'; ctx.textAlign = 'left';
  const w = ctx.measureText(str).width, off = mod(t * speed, w);
  for (let x = -W - off; x < W; x += w) {
    if (stroke) { ctx.lineWidth = sw; ctx.strokeStyle = stroke; ctx.strokeText(str, x, 0); }
    if (fill) { ctx.fillStyle = fill; ctx.fillText(str, x, 0); }
  }
  ctx.restore();
}
function ringText(str, r, size, col) {
  ctx.font = `italic 900 ${size}px ${SERIF}`; ctx.fillStyle = col; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  const ch = [...str];
  ch.forEach((c, i) => { ctx.save(); ctx.rotate(i / ch.length * TAU); ctx.translate(0, -r); ctx.fillText(c, 0, 0); ctx.restore(); });
}

/* ---------- the mascot: MOCHI ---------- */
function mochi(cx, by, w, h, { face = 0, blink = 0, mood = 'calm', surprise = 0, leaf = 0, t = 0 } = {}) {
  ctx.save();
  // ground shadow
  ctx.fillStyle = 'rgba(74,51,38,.16)'; ell(cx, by + 8, w * .5, w * .075); ctx.fill();
  // body
  ctx.beginPath();
  ctx.moveTo(cx - w / 2, by - h * .16);
  ctx.bezierCurveTo(cx - w / 2, by - h * .78, cx - w * .3, by - h, cx, by - h);
  ctx.bezierCurveTo(cx + w * .3, by - h, cx + w / 2, by - h * .78, cx + w / 2, by - h * .16);
  ctx.quadraticCurveTo(cx + w / 2, by, cx + w * .34, by);
  ctx.lineTo(cx - w * .34, by);
  ctx.quadraticCurveTo(cx - w / 2, by, cx - w / 2, by - h * .16);
  ctx.closePath();
  const g = ctx.createRadialGradient(cx - w * .16, by - h * .78, w * .04, cx, by - h * .45, Math.max(w, h) * .8);
  g.addColorStop(0, '#FFFFFF'); g.addColorStop(.55, '#FCF7F0'); g.addColorStop(1, '#E9DCCB');
  ctx.fillStyle = g; ctx.fill();
  ctx.lineWidth = 5; ctx.strokeStyle = 'rgba(74,51,38,.28)'; ctx.stroke();
  // glossy highlight
  ctx.fillStyle = 'rgba(255,255,255,.95)'; ell(cx - w * .22, by - h * .74, w * .085, h * .045, -.6); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.8)'; circ(cx - w * .1, by - h * .86, w * .02); ctx.fill();
  // leaf
  if (leaf > 0) {
    ctx.save(); ctx.translate(cx + w * .06, by - h + 6); ctx.rotate(Math.sin(t * 5) * .15); ctx.scale(leaf, leaf);
    ctx.fillStyle = '#8F9A7E';
    ell(-26, -30, 34, 16, -.7); ctx.fill(); ell(24, -36, 38, 17, .6); ctx.fill();
    ctx.strokeStyle = '#6F7A60'; ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(0, 0); ctx.quadraticCurveTo(2, -20, 18, -34); ctx.stroke();
    ctx.restore();
  }
  // face
  if (face > 0) {
    const ex = w * .15, ey = by - h * .44, er = Math.min(w, h * 1.2) * .038 * face;
    ctx.fillStyle = COL.mocha; ctx.strokeStyle = COL.mocha; ctx.lineCap = 'round';
    for (const s of [-1, 1]) {
      if (mood === 'happy') {
        ctx.lineWidth = er * .8; ctx.beginPath(); ctx.arc(cx + s * ex, ey + er * .5, er * 1.1, PI * 1.15, PI * 1.85); ctx.stroke();
      } else {
        const sy = Math.max(.08, 1 - blink) * (1 + surprise * .4);
        ell(cx + s * ex, ey, er * (1 + surprise * .3), er * 1.15 * sy); ctx.fill();
        ctx.fillStyle = '#fff'; circ(cx + s * ex - er * .3, ey - er * .35 * sy, er * .32 * sy); ctx.fill(); ctx.fillStyle = COL.mocha;
      }
    }
    // blush
    ctx.fillStyle = `rgba(214,150,135,${.5 * face})`;
    ell(cx - w * .27, by - h * .33, w * .07, h * .035); ctx.fill(); ell(cx + w * .27, by - h * .33, w * .07, h * .035); ctx.fill();
    // mouth
    ctx.lineWidth = Math.max(3, w * .014); ctx.beginPath();
    const my = by - h * .35, mw = w * .035;
    if (surprise > .3) { ell(cx, my + mw * .4, mw * .8, mw * 1.1); ctx.fill(); }
    else if (mood === 'happy') { ctx.moveTo(cx - mw * 1.4, my - mw * .3); ctx.quadraticCurveTo(cx, my + mw * 2.4, cx + mw * 1.4, my - mw * .3); ctx.closePath(); ctx.fillStyle = '#C8584F'; ctx.fill(); }
    else { ctx.arc(cx - mw, my, mw, 0, PI); ctx.arc(cx + mw, my, mw, 0, PI); ctx.stroke(); }
  }
  ctx.restore();
}

// the real MOCHI character (cut-out illustration), animated with squash/stretch
let CHARA = null;
function chara(cx, by, h, { sx = 1, sy = 1, rot = 0, alpha = 1, shadow = true } = {}) {
  if (!CHARA) return;
  const w = h * CHARA.width / CHARA.height;
  ctx.save(); ctx.globalAlpha *= alpha;
  if (shadow) { const g = ctx.createRadialGradient(cx, by, 0, cx, by, w * .42 * sx); g.addColorStop(0, 'rgba(58,48,42,.22)'); g.addColorStop(1, 'rgba(58,48,42,0)'); ctx.fillStyle = g; ell(cx, by + 2, w * .42 * sx, w * .07); ctx.fill(); }
  ctx.translate(cx, by); ctx.rotate(rot); ctx.scale(sx, sy);
  ctx.drawImage(CHARA, -w / 2, -h, w, h);
  ctx.restore();
}
function twinkles(u, pts, col = COL.yolk) {
  pts.forEach(([x, y, r, ph], i) => { const a = .5 + .5 * Math.sin(u * 6 + ph); ctx.fillStyle = col; ctx.globalAlpha = a; star4(x, y, r * (.7 + .3 * a), 0); });
  ctx.globalAlpha = 1;
}

/* ---------- food illustrations (top view) ---------- */
function lemonSlice(x, y, r, rot) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot);
  circ(0, 0, r); ctx.fillStyle = '#F2C318'; ctx.fill();
  circ(0, 0, r * .9); ctx.fillStyle = '#FFF7D1'; ctx.fill();
  ctx.fillStyle = '#FFE15A';
  for (let s = 0; s < 9; s++) { const a = s / 9 * TAU; ctx.beginPath(); ctx.moveTo(0, 0); ctx.arc(0, 0, r * .8, a + .09, a + TAU / 9 - .09); ctx.closePath(); ctx.fill(); }
  circ(0, 0, r * .1); ctx.fillStyle = '#FFF7D1'; ctx.fill();
  ctx.restore();
}
function tomato(x, y, r) {
  const g = ctx.createRadialGradient(x - r * .3, y - r * .3, r * .1, x, y, r);
  g.addColorStop(0, '#FF7A5C'); g.addColorStop(1, '#C82E1F');
  circ(x, y, r); ctx.fillStyle = g; ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.55)'; ell(x - r * .38, y - r * .38, r * .22, r * .12, -.7); ctx.fill();
  ctx.fillStyle = '#4E8B3A'; star4(x + r * .1, y + r * .05, r * .38, .4);
}
function yolk(x, y, r) {
  const g = ctx.createRadialGradient(x - r * .3, y - r * .35, r * .1, x, y, r);
  g.addColorStop(0, '#FFD066'); g.addColorStop(.7, '#F6A11B'); g.addColorStop(1, '#E08A0C');
  circ(x, y, r); ctx.fillStyle = g; ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.7)'; ell(x - r * .35, y - r * .4, r * .25, r * .13, -.6); ctx.fill();
}
function noodles(R, col, n, lw, seed, amp = 16) {
  ctx.strokeStyle = col; ctx.lineWidth = lw; ctx.lineCap = 'round';
  for (let j = 0; j < n; j++) {
    const y0 = -R + (j + .5) * 2 * R / n; ctx.beginPath();
    for (let x = -R; x <= R; x += 16) { const y = y0 + Math.sin(x * .024 + j * 1.7 + seed) * amp; x === -R ? ctx.moveTo(x, y) : ctx.lineTo(x, y); }
    ctx.stroke();
  }
}
function dots(n, R, cols, rmin, rmax, seed, k, cx = 0, cy = 0, spread = 1) {
  for (let j = 0; j < n; j++) {
    const kk = E.outBack(cl(k * 1.6 - hs(seed + j) * .6), 2);
    if (kk <= 0) continue;
    const a = hs(seed + j * 3) * TAU, d = Math.sqrt(hs(seed + j * 5)) * R * spread;
    ctx.fillStyle = cols[j % cols.length];
    circ(cx + Math.cos(a) * d, cy + Math.sin(a) * d, lerp(rmin, rmax, hs(seed + j * 11)) * kk); ctx.fill();
  }
}
function toppings(kind, R, u) {
  const k = P(u, .04, .34), pop = j => E.outBack(P(u, .04 + j * .025, .22 + j * .025), 2.2);
  if (kind === 'lemon') {
    noodles(R, '#F4E9C6', 7, 30, 1, 10);
    for (let j = 0; j < 7; j++) { const a = j / 7 * TAU; lemonSlice(Math.cos(a) * R * .56, Math.sin(a) * R * .56, R * .3 * pop(j), a + u * 2); }
    lemonSlice(0, 0, R * .3 * pop(7), -u * 2);
    dots(40, R * .9, ['#7DB55A', '#A6D27E', '#EAF5D8'], 6, 13, 40, P(u, .15, .4));
  } else if (kind === 'tomato') {
    dots(9, R * .7, ['#3F8A3A', '#58A147'], 30, 46, 7, k);
    for (let j = 0; j < 6; j++) { const a = j / 6 * TAU + .3; tomato(Math.cos(a) * R * .55, Math.sin(a) * R * .55, R * .2 * pop(j)); }
    ctx.fillStyle = '#FFF3C4';
    for (let j = 0; j < 5; j++) { const a = j / 5 * TAU + 1; const s = pop(j + 4); ell(Math.cos(a) * R * .2, Math.sin(a) * R * .2, R * .2 * s, R * .13 * s, a); ctx.fill(); }
    tomato(0, 0, R * .22 * pop(9));
  } else if (kind === 'ribbon') {
    ctx.save(); ctx.rotate(.5);
    const cs = ['#7FB04F', '#D8E9B8', '#FFFFFF', '#9BC76A'];
    for (let j = 0; j < 12; j++) {
      const kk = P(u, .03 + j * .015, .2 + j * .015); if (kk <= 0) continue;
      ctx.strokeStyle = cs[j % 4]; ctx.lineWidth = 24; ctx.lineCap = 'round'; ctx.beginPath();
      const y0 = -R + (j + .5) * 2 * R / 12;
      for (let x = -R; x <= -R + 2 * R * E.outC(kk); x += 14) { const y = y0 + Math.sin(x * .03 + j) * 22; x === -R ? ctx.moveTo(x, y) : ctx.lineTo(x, y); }
      ctx.stroke();
    }
    ctx.restore();
    dots(14, R * .8, ['#E8C98A', '#DDB673'], 16, 22, 21, P(u, .18, .4));
    ctx.fillStyle = '#E2472F';
    for (let j = 0; j < 10; j++) { const s = pop(j + 3); const a = hs(j + 50) * TAU, d = hs(j + 60) * R * .8; ctx.save(); ctx.translate(Math.cos(a) * d, Math.sin(a) * d); ctx.rotate(a); ctx.scale(s, s); rr(-14, -14, 28, 28, 6); ctx.fill(); ctx.restore(); }
  } else if (kind === 'soba') {
    noodles(R, '#8C6F5A', 16, 11, 2, 18);
    noodles(R, '#A2826B', 16, 5, 4, 14);
    ctx.fillStyle = '#F4EEDD'; circ(0, 0, R * .5 * E.outC(k)); ctx.fill();
    dots(30, R * .42, ['#6FA24A', '#8DC063', '#4E8636'], 8, 16, 90, P(u, .1, .3), R * .05, -R * .1);
    dots(12, R * .35, ['#9B6A3A', '#B67E45'], 12, 18, 120, P(u, .12, .32), -R * .1, R * .15);
    yolk(0, 0, R * .2 * E.outBack(P(u, .2, .32), 3));
  } else if (kind === 'kong') {
    noodles(R, '#8E8378', 18, 10, 5, 14);
    ctx.fillStyle = 'rgba(239,219,187,.85)'; circ(0, 0, R); ctx.fill();
    ctx.strokeStyle = '#6DA24C'; ctx.lineWidth = 12; ctx.lineCap = 'round';
    for (let j = 0; j < 14; j++) { const s = pop(j); const a = -1 + j * .12; ctx.beginPath(); ctx.moveTo(Math.cos(a) * R * .1, Math.sin(a) * R * .1 - R * .3); ctx.lineTo(Math.cos(a) * R * .8 * s, Math.sin(a) * R * .8 * s - R * .3); ctx.stroke(); }
    dots(40, R * .9, ['#F7F1E6', '#3A2A20'], 3, 6, 150, P(u, .15, .35));
    yolk(-R * .12, R * .18, R * .19 * E.outBack(P(u, .2, .32), 3));
  } else if (kind === 'choco') {
    for (let j = 0; j < 46; j++) {
      const d0 = hs(j + 200) * .18, kk = P(u, .02 + d0, .2 + d0); if (kk <= 0) continue;
      const a = hs(j + 210) * TAU, d = Math.sqrt(hs(j + 220)) * R * .85;
